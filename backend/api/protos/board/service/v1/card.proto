syntax = "proto3";

package board.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 看板卡片管理服务
service CardService {
  // 查询卡片列表
  rpc List (pagination.PagingRequest) returns (ListCardResponse) {}

  // 查询卡片详情
  rpc Get (GetCardRequest) returns (Card) {}

  // 创建卡片
  rpc Create (CreateCardRequest) returns (Card) {}

  // 更新卡片
  rpc Update (UpdateCardRequest) returns (Card) {}

  // 删除卡片
  rpc Delete (DeleteCardRequest) returns (google.protobuf.Empty) {}

  // 移动卡片（同列重排/跨列移动，Lexorank 排序）
  rpc Move (MoveCardRequest) returns (Card) {}
}

// 看板卡片
message Card {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "卡片ID"}
  ]; // 卡片ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "卡片标题"}
  ]; // 卡片标题

  optional string description = 3 [
    json_name = "description",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "卡片描述/正文"}
  ]; // 卡片描述/正文

  optional string rank = 4 [
    json_name = "rank",
    (gnostic.openapi.v3.property) = {description: "列内排序权重（Lexorank 字典序字符串，服务端维护）"}
  ]; // 列内排序权重（Lexorank 字典序字符串，服务端维护）

  optional uint32 version = 5 [
    json_name = "version",
    (gnostic.openapi.v3.property) = {description: "乐观锁版本号，每次更新自增（离线同步冲突检测用）"}
  ]; // 乐观锁版本号，每次更新自增（离线同步冲突检测用）

  optional uint32 column_id = 6 [
    json_name = "columnId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "所属列ID"}
  ]; // 所属列ID

  optional uint32 board_id = 7 [
    json_name = "boardId",
    (gnostic.openapi.v3.property) = {description: "所属看板ID（冗余自列，供看板级查询，服务端维护）"}
  ]; // 所属看板ID（冗余自列，供看板级查询，服务端维护）

  optional google.protobuf.Timestamp due_date = 8 [
    json_name = "dueDate",
    (gnostic.openapi.v3.property) = {description: "卡片截止日期，可选"}
  ]; // 卡片截止日期，可选

  optional bool archived = 9 [
    json_name = "archived",
    (gnostic.openapi.v3.property) = {description: "归档标记，归档卡保留可见但默认收起"}
  ]; // 归档标记，归档卡保留可见但默认收起

  optional string cover_color = 10 [
    json_name = "coverColor",
    (gnostic.openapi.v3.property) = {description: "卡片封面纯色标识，取命名色集合"}
  ]; // 卡片封面纯色标识，取命名色集合

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ]; // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 查询卡片列表 - 回应
message ListCardResponse {
  repeated Card items = 1;
  uint64 total = 2;
}

// 查询卡片详情 - 请求
message GetCardRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建卡片 - 请求
message CreateCardRequest {
  Card data = 1;
}

// 更新卡片 - 请求
message UpdateCardRequest {
  uint32 id = 1;

  Card data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,description"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。

  optional uint32 expected_version = 5 [
    json_name = "expectedVersion",
    (gnostic.openapi.v3.property) = {description: "乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT（离线同步冲突检测）"}
  ]; // 乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT（离线同步冲突检测）
}

// 删除卡片 - 请求
message DeleteCardRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 移动卡片 - 请求
message MoveCardRequest {
  uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "要移动的卡片ID"}
  ]; // 要移动的卡片ID

  optional uint32 target_column_id = 2 [
    json_name = "targetColumnId",
    (gnostic.openapi.v3.property) = {description: "目标列ID；为 0/缺省表示在当前列内重排"}
  ]; // 目标列ID；为 0/缺省表示在当前列内重排

  oneof anchor {
    uint32 before_id = 3 [
      json_name = "beforeId",
      (gnostic.openapi.v3.property) = {description: "移动到目标列中该卡片之前（目标列内邻居卡片ID）"}
    ]; // 移动到目标列中该卡片之前（目标列内邻居卡片ID）

    uint32 after_id = 4 [
      json_name = "afterId",
      (gnostic.openapi.v3.property) = {description: "移动到目标列中该卡片之后（目标列内邻居卡片ID）"}
    ]; // 移动到目标列中该卡片之后（目标列内邻居卡片ID）
  }

  // anchor 为空时追加到目标列末尾

  optional uint32 expected_version = 10 [
    json_name = "expectedVersion",
    (gnostic.openapi.v3.property) = {description: "乐观锁期望版本；>0 时校验，不匹配返回 409（离线同步冲突检测）"}
  ]; // 乐观锁期望版本；>0 时校验，不匹配返回 409（离线同步冲突检测）
}
