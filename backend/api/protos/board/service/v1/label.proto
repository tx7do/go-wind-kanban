syntax = "proto3";

package board.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 看板标签管理服务（标签为看板级资源，卡片通过关联贴标）
service LabelService {
  // 查询标签列表
  rpc List (pagination.PagingRequest) returns (ListLabelResponse) {}

  // 查询标签详情
  rpc Get (GetLabelRequest) returns (Label) {}

  // 创建标签
  rpc Create (CreateLabelRequest) returns (Label) {}

  // 更新标签
  rpc Update (UpdateLabelRequest) returns (Label) {}

  // 删除标签
  rpc Delete (DeleteLabelRequest) returns (google.protobuf.Empty) {}

  // 为卡片设置标签集合（全量替换，事务内差量增删）
  rpc SetCardLabels (SetCardLabelsRequest) returns (google.protobuf.Empty) {}

  // 查询卡片标签
  rpc GetCardLabels (GetCardLabelsRequest) returns (ListLabelResponse) {}
}

// 看板标签（Planka 同款：board 级 + 颜色）
message Label {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "标签ID"}
  ]; // 标签ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "标签名称"}
  ]; // 标签名称

  optional string color = 3 [
    json_name = "color",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "标签颜色（如 red/blue/#hex）"}
  ]; // 标签颜色（如 red/blue/#hex）

  optional uint32 board_id = 4 [
    json_name = "boardId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "所属看板ID"}
  ]; // 所属看板ID

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ]; // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 查询标签列表 - 回应
message ListLabelResponse {
  repeated Label items = 1;
  uint64 total = 2;
}

// 查询标签详情 - 请求
message GetLabelRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {description: "视图字段过滤器，用于控制返回的字段"}
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建标签 - 请求
message CreateLabelRequest {
  Label data = 1;
}

// 更新标签 - 请求
message UpdateLabelRequest {
  uint32 id = 1;

  Label data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,color"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。

  optional uint32 expected_version = 5 [
    json_name = "expectedVersion",
    (gnostic.openapi.v3.property) = {description: "乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT"}
  ]; // 乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT
}

// 删除标签 - 请求
message DeleteLabelRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 设置卡片标签 - 请求（全量替换）
message SetCardLabelsRequest {
  uint32 card_id = 1 [
    json_name = "cardId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "卡片ID"}
  ]; // 卡片ID

  repeated uint32 label_ids = 2 [
    json_name = "labelIds",
    (gnostic.openapi.v3.property) = {description: "目标标签ID全集（差量增删）"}
  ]; // 目标标签ID全集（差量增删）
}

// 查询卡片标签 - 请求
message GetCardLabelsRequest {
  uint32 card_id = 1 [
    json_name = "cardId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "卡片ID"}
  ]; // 卡片ID
}
