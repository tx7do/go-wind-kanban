syntax = "proto3";

package board.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 看板列管理服务
service ColumnService {
  // 查询列列表
  rpc List (pagination.PagingRequest) returns (ListColumnResponse) {}

  // 查询列详情
  rpc Get (GetColumnRequest) returns (Column) {}

  // 创建列
  rpc Create (CreateColumnRequest) returns (Column) {}

  // 更新列
  rpc Update (UpdateColumnRequest) returns (Column) {}

  // 删除列
  rpc Delete (DeleteColumnRequest) returns (google.protobuf.Empty) {}

  // 移动列（看板内重排序，Lexorank 排序）
  rpc Move (MoveColumnRequest) returns (Column) {}
}

// 看板列
message Column {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "列ID"}
  ]; // 列ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "列名称"}
  ]; // 列名称

  optional string color = 3 [
    json_name = "color",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "列颜色标识"}
  ]; // 列颜色标识

  optional string rank = 4 [
    json_name = "rank",
    (gnostic.openapi.v3.property) = {description: "看板内排序权重（Lexorank 字典序字符串，服务端维护）"}
  ]; // 看板内排序权重（Lexorank 字典序字符串，服务端维护）

  optional uint32 version = 5 [
    json_name = "version",
    (gnostic.openapi.v3.property) = {description: "乐观锁版本号，每次更新自增（离线同步冲突检测用）"}
  ]; // 乐观锁版本号，每次更新自增（离线同步冲突检测用）

  optional uint32 board_id = 6 [
    json_name = "boardId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "所属看板ID"}
  ]; // 所属看板ID

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ]; // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}]; // 删除时间
}

// 查询列列表 - 回应
message ListColumnResponse {
  repeated Column items = 1;
  uint64 total = 2;
}

// 查询列详情 - 请求
message GetColumnRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建列 - 请求
message CreateColumnRequest {
  Column data = 1;
}

// 更新列 - 请求
message UpdateColumnRequest {
  uint32 id = 1;

  Column data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,color"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。

  optional uint32 expected_version = 5 [
    json_name = "expectedVersion",
    (gnostic.openapi.v3.property) = {description: "乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT（离线同步冲突检测）"}
  ]; // 乐观锁期望版本；>0 时服务端校验当前版本，不匹配返回 409 CONFLICT（离线同步冲突检测）
}

// 删除列 - 请求
message DeleteColumnRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 移动列 - 请求
message MoveColumnRequest {
  uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "要移动的列ID"}
  ]; // 要移动的列ID

  oneof anchor {
    uint32 before_id = 2 [
      json_name = "beforeId",
      (gnostic.openapi.v3.property) = {description: "移动到该列之前（同看板邻居列ID）"}
    ]; // 移动到该列之前（同看板邻居列ID）

    uint32 after_id = 3 [
      json_name = "afterId",
      (gnostic.openapi.v3.property) = {description: "移动到该列之后（同看板邻居列ID）"}
    ]; // 移动到该列之后（同看板邻居列ID）
  }

  // anchor 为空时追加到看板列末尾

  optional uint32 expected_version = 10 [
    json_name = "expectedVersion",
    (gnostic.openapi.v3.property) = {description: "乐观锁期望版本；>0 时校验，不匹配返回 409（离线同步冲突检测）"}
  ]; // 乐观锁期望版本；>0 时校验，不匹配返回 409（离线同步冲突检测）
}
