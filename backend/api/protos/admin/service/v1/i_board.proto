syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";

import "board/service/v1/board.proto";

// 看板管理服务
service BoardService {
  // 查询看板列表
  rpc List (pagination.PagingRequest) returns (board.service.v1.ListBoardResponse) {
    option (google.api.http) = {
      get: "/admin/v1/boards"
    };
  }

  // 查询看板详情
  rpc Get (board.service.v1.GetBoardRequest) returns (board.service.v1.Board) {
    option (google.api.http) = {
      get: "/admin/v1/boards/{id}"
    };
  }

  // 创建看板
  rpc Create (board.service.v1.CreateBoardRequest) returns (board.service.v1.Board) {
    option (google.api.http) = {
      post: "/admin/v1/boards"
      body: "*"
    };
  }

  // 更新看板
  rpc Update (board.service.v1.UpdateBoardRequest) returns (board.service.v1.Board) {
    option (google.api.http) = {
      put: "/admin/v1/boards/{id}"
      body: "*"
    };
  }

  // 删除看板
  rpc Delete (board.service.v1.DeleteBoardRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/boards/{id}"
    };
  }

  // 差量同步（客户端上报已知版本，仅返回变化实体与删除 ID）
  rpc SyncBoard (board.service.v1.SyncBoardRequest) returns (board.service.v1.SyncBoardResponse) {
    option (google.api.http) = {
      post: "/admin/v1/boards/{board_id}:sync"
      body: "*"
    };
  }

  // 移动看板（租户内重排序）
  rpc Move (board.service.v1.MoveBoardRequest) returns (board.service.v1.Board) {
    option (google.api.http) = {
      post: "/admin/v1/boards/{id}:move"
      body: "*"
    };
  }
}
