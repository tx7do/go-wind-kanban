syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";

import "board/service/v1/label.proto";

// 看板标签管理服务
service LabelService {
  rpc List (pagination.PagingRequest) returns (board.service.v1.ListLabelResponse) {
    option (google.api.http) = {
      get: "/admin/v1/labels"
    };
  }

  rpc Get (board.service.v1.GetLabelRequest) returns (board.service.v1.Label) {
    option (google.api.http) = {
      get: "/admin/v1/labels/{id}"
    };
  }

  rpc Create (board.service.v1.CreateLabelRequest) returns (board.service.v1.Label) {
    option (google.api.http) = {
      post: "/admin/v1/labels"
      body: "*"
    };
  }

  rpc Update (board.service.v1.UpdateLabelRequest) returns (board.service.v1.Label) {
    option (google.api.http) = {
      put: "/admin/v1/labels/{id}"
      body: "*"
    };
  }

  rpc Delete (board.service.v1.DeleteLabelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/labels/{id}"
    };
  }

  rpc SetCardLabels (board.service.v1.SetCardLabelsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/cards/{card_id}:set-labels"
      body: "*"
    };
  }

  rpc GetCardLabels (board.service.v1.GetCardLabelsRequest) returns (board.service.v1.ListLabelResponse) {
    option (google.api.http) = {
      get: "/admin/v1/cards/{card_id}/labels"
    };
  }
}
