components:
    schemas:
        KratosStatus:
            type: object
            properties:
                code:
                    type: number
                    description: 错误码
                    format: int32
                message:
                    type: string
                    description: 错误消息
                reason:
                    type: string
                    description: 错误原因
                metadata:
                    type: object
                    description: 元数据
            description: Kratos错误返回
        authentication.service.v1.LoginRequest:
            required:
                - grant_type
            type: object
            properties:
                grant_type:
                    enum:
                        - password
                        - client_credentials
                        - authorization_code
                        - refresh_token
                        - implicit
                    type: string
                    default: password
                    description: 授权类型，此处的值固定为"password"，必选项。
                    format: enum
                client_id:
                    type: string
                    description: 客户端ID
                client_secret:
                    type: string
                    description: 客户端密钥
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                redirect_uri:
                    type: string
                    description: 跳转链接
                user_id:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 用户名
                email:
                    type: string
                    description: 电子邮件地址
                mobile:
                    type: string
                    description: 手机号
                password:
                    type: string
                    description: 用户的密码
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                code:
                    type: string
                    description: 授权请求中收到的一次性验证/认证码。(当使用授权码模式时)
                client_type:
                    enum:
                        - admin
                        - app
                    type: string
                    description: 客户端类型
                    format: enum
                device_id:
                    type: string
                    description: 设备唯一标识（可选），用于设备绑定、推送、风控等
                jti:
                    type: string
                    description: 建议客户端生成并提供 jti（JWT ID）作为唯一标识，服务端可据此防止重放攻击
                tenant_code:
                    type: string
                    description: 租户编号，留空表示平台登录（平台超级管理员）；非空时按该编号解析对应租户
            description: 用户登录 - 请求
        authentication.service.v1.LoginResponse:
            type: object
            properties:
                token_type:
                    enum:
                        - bearer
                        - mac
                    type: string
                    default: Bearer
                    description: 令牌的类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型，通常只是字符串“Bearer”。
                    format: enum
                access_token:
                    type: string
                    description: 访问令牌，必选项。授权服务器颁发的访问令牌字符串。
                expires_in:
                    type: string
                    description: 访问令牌过期时间（秒）
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                refresh_expires_in:
                    type: string
